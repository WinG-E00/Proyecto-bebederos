<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Panel del Peón</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Peon.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-success">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🐄 Sistema Ganadero</span>

        <div>
          <span id="hora" class="text-white me-3"></span>

          <button id="modoOscuro" class="btn btn-light">Modo Oscuro</button>
        </div>
      </div>
    </nav>

    <header class="text-center py-4">
      <h1 class="titulo">Bienvenido Usuario</h1>
    </header>

    <div class="container">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card tarjeta h-100">
            <img
              src="https://images.unsplash.com/photo-1516467508483-a7212febe31a"
              class="card-img-top"
            />

            <div class="card-body text-center">
              <h3>Bebederos</h3>

              <div class="mb-3">
                <span class="badge bg-success fs-6">
                  Estado General: Normal
                </span>
              </div>

              <h5>Nivel promedio</h5>

              <div class="progress mb-3">
                <div
                  id="barraAgua"
                  class="progress-bar bg-primary text-black"
                  style="width: 75%"
                >
                  75%
                </div>
              </div>

              <a
                href="Proyecto-bebederos/Estado-bebederos/Estado_bebederos.html"
                class="btn btn-success"
              >
                Ver Estado
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card tarjeta h-100">
            <img
              src="https://images.unsplash.com/photo-1504608524841-42fe6f032b4b"
              class="card-img-top"
            />

            <div class="card-body text-center">
              <h3>Clima Local</h3>

              <h1 id="temperatura">27°C</h1>

              <p id="estadoClima">Soleado</p>

              <a
                href="https://www.msn.com/es-ar/el-tiempo"
                target="_blank"
                class="btn btn-primary"
              >
                Ver Pronóstico
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="alerta" class="alert alert-danger text-center mt-4 d-none"></div>

    <script src="Peon.Js"></script>

    <footer class="bg-success text-center text-light">
      &copy; Todos los derechos de autor: Franco vega
    </footer>
  </body>
</html>
