<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio De Sesión</title>
    <link rel="stylesheet" href="css/login.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark navbar-custom">
      <div class="container-fluid">
        <span class="navbar-brand">🌱 Proyecto Bebederos</span>
        <div>
          <a href="login.html" class="nav-link-custom">Iniciar sesión</a>
          <a href="registro.html" class="nav-link-custom">Registrarse</a>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="overlay">
      <div class="card-login">
        <h2>Iniciar Sesión</h2>
        <p id="mensajeRol"></p>
        <form>
          <!-- Email -->
          <input
            type="email"
            class="form-control"
            placeholder="Email"
            required
          />

          <!-- Password -->
          <div class="position-relative">
            <input
              type="password"
              class="form-control"
              placeholder="Contraseña"
              required
            />
            <span class="toggle-password">Mostrar</span>
          </div>

          <!-- Recordar usuario -->
          <div class="form-check text-start mt-2">
            <input class="form-check-input" type="checkbox" id="recordar" />
            <label class="form-check-label" for="recordar">
              Recordar usuario
            </label>
          </div>

          <!-- Botón login -->
          <button type="submit" class="btn btn-login mt-3">Ingresar</button>
        </form>

        <!-- Links -->
        <div class="extra-links">
          <a href="#">¿Olvidaste tu contraseña?</a>

          <p class="mt-2">
            ¿No tenés cuenta?
            <a href="registro.html">Registrate</a>
          </p>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
