<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Dueño - Proyecto Bebederos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/interfaz-dueño.css" />
    <link rel="icon" href="css/imgs/images.png" />
  </head>
  <body>
    <nav>
      <h2 class="fw-bold text-white m-0">🚰Proyecto Bebederos</h2>

      <ul class="d-flex gap-3 list-unstyled m-0 align-items-center">
        <li>
          <span class="text-white opacity-75">Bienvenido, Dueño 👨‍🌾</span>
        </li>
        <li>
          <a
            href="#"
            class="text-white text-decoration-none px-2 py-1 rounded hover-bg"
          >
          </a>
        </li>
      </ul>
    </nav>

    <main class="container my-5">
      <section>
        <h1 class="display-4 fw-bold text-success mb-2">Panel de Control</h1>
        <p class="text-muted fs-5 mb-4">
          Gestión general del establecimiento y monitoreo de dispositivos.
        </p>

        <div class="row g-3 mb-5 text-start">
          <div class="col-12 col-md-4">
            <div
              class="p-3 bg-white border rounded shadow-sm custom-metric-card"
            >
              <span class="fs-4">🟢</span>
              <h4 class="fw-bold fs-6 text-secondary mt-2 mb-1">
                Bebederos Activos
              </h4>
              <p class="fs-2 fw-bold text-success m-0">12 / 12</p>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div
              class="p-3 bg-white border rounded shadow-sm custom-metric-card"
            >
              <span class="fs-4">⚠️</span>
              <h4 class="fw-bold fs-6 text-secondary mt-2 mb-1">
                Alertas de Nivel
              </h4>
              <p class="fs-2 fw-bold text-warning m-0">1</p>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div
              class="p-3 bg-white border rounded shadow-sm custom-metric-card"
            >
              <span class="fs-4">🧑‍🔧</span>
              <h4 class="fw-bold fs-6 text-secondary mt-2 mb-1">
                Peones Activos
              </h4>
              <p class="fs-2 fw-bold text-primary m-0">3</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Proyecto Bebederos © 2026</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
