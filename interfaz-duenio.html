<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Dueño - Proyecto Bebederos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/interfaz-dueño.css" />
    <link rel="icon" href="css/imgs/images.png" />
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <img
          src="css/imgs/ChatGPT Image 24 jun 2026, 03_33_06 p.m..png"
          alt=""
          style="width: 180px; height: auto"
        />

        <nav>
          <a class="active">Inicio</a>
          <a>Bebederos</a>
          <a>Peones</a>
          <a>Alertas</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <div class="header">
          <h2>Dueño</h2>
          <p>Resumen general</p>
        </div>

        <div class="dashboard">
          <!-- ESTADO -->
          <div class="box estado">
            <h4>Estado del sistema</h4>
            <p>Funcionando correctamente</p>

            <div class="status ok">
              <span class="dot"></span>
              Óptimo
            </div>
          </div>

          <!-- IMAGEN -->
          <div class="box imagen"></div>

          <!-- MÉTRICAS -->
          <div class="box metrica">
            <p>Bebederos</p>
            <h2>12</h2>
            <div class="bar green"></div>
          </div>

          <div class="box metrica">
            <p>Alertas</p>
            <h2>1</h2>
            <div class="bar yellow"></div>
          </div>

          <div class="box metrica">
            <p>Peones</p>
            <h2>3</h2>
            <div class="bar blue"></div>
          </div>

          <!-- ALERTAS -->
          <div class="box alertas">
            <h5>Alertas</h5>
            <div class="alert-box">⚠️ Nivel bajo en bebedero #8</div>
          </div>

          <!-- ACTIVIDAD -->
          <div class="box actividad">
            <h5>Actividad</h5>
            <p>✔️ Bebedero #3 recargado</p>
            <p>👨‍🔧 Peón activo</p>
          </div>
        </div>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
