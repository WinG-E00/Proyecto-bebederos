<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/registro.css" />
    <link rel="icon" href="css/imgs/images.png" />

    <style>
      /* loader */
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1b5e20;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #loader.active {
        opacity: 1;
        pointer-events: all;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <div>
        <a href="interfaz-principal.html">
          <img
            src="css/imgs/ChatGPT Image 24 jun 2026, 03_33_06 p.m..png"
            alt=""
            style="width: 180px; height: auto"
          />
        </a>
      </div>
      <div>
        <a href="./login.html">Iniciar sesión</a>
        <a href="registro.html">Registrarse</a>
      </div>
    </div>

    <div class="overlay">
      <div class="container">
        <div class="form-box">
          <h1>Registro</h1>



         <!-- //Aca hay que definir hacia adonde hara el metodo post -->
          <form action="/api/auth/register" method="POST" id="formularioRegister"  >
            <div>
              <label for="nombre">Nombre completo:</label>
              <input type="text" id="nombre" name="nombreCompleto" />
            </div>
            <div>
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div>
              <label for="password">Contraseña:</label>
              <input type="password" id="password" name="password" required />
              <div class="password-checklist small" id="checklist">
                <span id="rule-length">•6 caracteres</span>
                <span id="rule-uppercase">•Mayúscula</span>
                <span id="rule-number">•Número</span>
              </div>
              <p id="passwordStrength"></p>
              <p id="errorGeneral"></p>
              <p id="registroExitoso" class="success-msg"></p>
            </div>
            <div>
              <label for="rol">Rol:</label>
              <select id="rol" name="rol">
                <option value="">Seleccionar</option>
                <option value="owner">Dueño</option>
                <option value="slave">Peón</option>
              </select>
            </div>
            <button type="submit">Registrarse</button>
          </form>



          <p class="extra">
            ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
          </p>
        </div>
      </div>
    </div>

    <footer>
      <p>Proyecto Bebederos © 2026</p>
    </footer>

    <div id="loader">
      <div class="spinner"></div>
    </div>


    <!-- script transiciones -->
    <script src="js/transiciones.js"></script>
    
    <!-- script registro  -->
    <script src="js/registro.js"></script>
    

    <!-- script cdn boostrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    
  </body>
</html>
