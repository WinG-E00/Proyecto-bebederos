<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/registro.css" />
    <link rel="icon" href="css/imgs/images.png" />
  </head>

  <body>
    <div class="navbar">
      <div>
        <a href="interfaz-principal.html">
          <img
            src="css/imgs/ChatGPT Image 24 jun 2026, 03_33_06 p.m..png"
            alt=""
            style="width: 180px; height: auto"
          />
        </a>
      </div>
      <div>
        <a href="login.html">Iniciar sesión</a>
        <a href="registro.html">Registrarse</a>
      </div>
    </div>

    <div class="overlay">
      <div class="container">
        <div class="form-box">
          <h1>Registro</h1>
          <form>
            <div>
              <label for="nombre">Nombre completo:</label>
              <input type="text" id="nombre" name="nombre" />
            </div>
            <div>
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div>
              <label for="password">Contraseña:</label>
              <input type="password" id="password" name="password" required />
              <div class="password-checklist small" id="checklist">
                <span id="rule-length">•6 caracteres</span>
                <span id="rule-uppercase">•Mayúscula</span>
                <span id="rule-number">•Número</span>
              </div>
              <p id="passwordStrength"></p>
              <p id="errorGeneral"></p>
              <p id="registroExitoso" class="success-msg"></p>
            </div>
            <div>
              <label for="rol">Rol:</label>
              <select id="rol" name="rol">
                <option value="">Seleccionar</option>
                <option value="dueno">Dueño</option>
                <option value="peon">Peón</option>
              </select>
            </div>
            <button type="submit">Registrarse</button>
          </form>
          <p class="extra">
            ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
          </p>
        </div>
      </div>
    </div>

    <footer>
      <p>Proyecto Bebederos © 2026</p>
    </footer>

    <script src="js/registro.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
